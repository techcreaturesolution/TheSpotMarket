<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary Meta Tags -->
    <title>TheSpotMarket - Live Indian IPO GMP, Stocks & SpotAI Intelligence</title>
    <meta
      name="title"
      content="TheSpotMarket - Live Indian IPO GMP, Stocks & SpotAI Intelligence"
    />
    <meta
      name="description"
      content="Track real-time Indian Mainline & SME IPO subscriptions, live Grey Market Premiums (GMP), NSE/BSE stock movements, and analyze SEBI DRHP filings with SpotAI."
    />
    <meta
      name="keywords"
      content="IPO GMP, Grey Market Premium, Indian IPO tracker, SME IPO, NSE BSE live, SpotAI, IPO allotment status, SEBI DRHP prospectus, stock market intelligence, TheSpotMarket"
    />
    <meta name="author" content="TheSpotMarket Technologies Private Limited" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://thespotmarket.com/" />

    <!-- Color Theme & Mobile Web App Capabilities -->
    <meta name="theme-color" content="#040A07" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="TheSpotMarket" />
    <meta name="apple-mobile-web-app-title" content="TheSpotMarket" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/app_icon.png" />
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/app_icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Preload Critical Logo for instant FCP -->
    <link rel="preload" as="image" href="/images/app_icon.png" type="image/png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TheSpotMarket" />
    <meta property="og:url" content="https://thespotmarket.com/" />
    <meta
      property="og:title"
      content="TheSpotMarket - Every IPO. Every Market. One Smart App."
    />
    <meta
      property="og:description"
      content="Track live Indian IPO subscription figures, verified Grey Market Premiums (GMP), direct PAN allotment status, and SpotAI prospectus analysis."
    />
    <meta property="og:image" content="https://thespotmarket.com/images/app_icon.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TheSpotMarket App Preview - Indian IPO & Market Intelligence" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@thespotmarket" />
    <meta name="twitter:creator" content="@thespotmarket" />
    <meta name="twitter:url" content="https://thespotmarket.com/" />
    <meta
      name="twitter:title"
      content="TheSpotMarket - Live Indian IPO GMP & Market Intel"
    />
    <meta
      name="twitter:description"
      content="Zero Telegram noise. Institutional-speed IPO timelines, live GMP trends, and SpotAI prospectus insights right on your phone."
    />
    <meta name="twitter:image" content="https://thespotmarket.com/images/app_icon.png" />
    <meta name="twitter:image:alt" content="TheSpotMarket App Interface" />

    <!-- Structured Data: WebSite & Organization (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://thespotmarket.com/#website",
            "url": "https://thespotmarket.com/",
            "name": "TheSpotMarket",
            "description": "Next-generation market intelligence platform for Indian IPOs, stocks, live Grey Market Premium (GMP), and SpotAI filings analysis.",
            "publisher": {
              "@id": "https://thespotmarket.com/#organization"
            },
            "inLanguage": "en-IN"
          },
          {
            "@type": "Organization",
            "@id": "https://thespotmarket.com/#organization",
            "name": "TheSpotMarket Technologies Private Limited",
            "url": "https://thespotmarket.com/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://thespotmarket.com/images/app_icon.png",
              "width": 512,
              "height": 512
            },
            "sameAs": [
              "https://twitter.com/thespotmarket",
              "https://www.linkedin.com/company/thespotmarket",
              "https://instagram.com/thespotmarket",
              "https://t.me/thespotmarket"
            ],
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Mumbai",
              "addressRegion": "Maharashtra",
              "addressCountry": "IN"
            },
            "contactPoint": {
              "@type": "ContactPoint",
              "email": "thespotmarket29@gmail.com",
              "contactType": "customer support"
            }
          }
        ]
      }
    </script>
  </head>
  <body class="bg-background text-text font-sans antialiased selection:bg-primary/20 selection:text-white">
    <div id="root">
      <!-- 0ms Zero-FOUC Instant Preloader -->
      <div style="position:fixed;inset:0;background-color:#040A07;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:99999;font-family:system-ui,-apple-system,sans-serif;">
        <div style="position:relative;width:64px;height:64px;display:flex;align-items:center;justify-content:center;">
          <div style="position:absolute;inset:-8px;border-radius:24px;background:radial-gradient(circle,rgba(16,185,129,0.35) 0%,transparent 70%);"></div>
          <img src="/images/app_icon.png" alt="TheSpotMarket" width="48" height="48" style="width:48px;height:48px;border-radius:14px;border:1px solid rgba(16,185,129,0.4);box-shadow:0 0 30px rgba(16,185,129,0.3);" />
        </div>
        <div style="color:#ffffff;font-size:18px;font-weight:800;letter-spacing:-0.5px;">TheSpot<span style="color:#10B981;">Market</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
